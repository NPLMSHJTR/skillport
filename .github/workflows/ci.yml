name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
        env:
          PYTHONPATH: src

  dogfood:
    name: our own skills are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The shipped example must sync cleanly
        run: |
          python -m skillport check . --target codex --no-color
          python -m skillport sync . --target codex
          python -m skillport check . --target codex --no-color
        env:
          PYTHONPATH: src
      - name: Drift must be detected
        run: |
          set -e
          echo "hand edit" >> .codex/skills/example-review/SKILL.md
          if python -m skillport check . --target codex --no-color; then
            echo "expected a non-zero exit after editing a copy"
            exit 1
          fi
          echo "drift correctly detected"
        env:
          PYTHONPATH: src
      - name: Prune must refuse to run without --yes
        run: |
          set -e
          mkdir -p .codex/skills/orphan
          printf -- '---\nname: orphan\n---\n' > .codex/skills/orphan/SKILL.md
          if python -m skillport prune . --target codex --no-color; then
            echo "prune must exit non-zero without --yes"
            exit 1
          fi
          test -d .codex/skills/orphan
          echo "prune correctly refused"
        env:
          PYTHONPATH: src

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/